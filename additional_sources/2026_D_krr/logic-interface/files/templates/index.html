<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Family KB Chatbot — KRR A2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  header { background: #1a1a2e; padding: 16px 24px; border-bottom: 1px solid #2a2a4a; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 20px; color: #7c83fd; }
  header span { font-size: 13px; color: #888; }

  .tabs { display: flex; background: #1a1a2e; border-bottom: 1px solid #2a2a4a; }
  .tab { padding: 12px 28px; cursor: pointer; font-size: 14px; color: #888; border-bottom: 3px solid transparent; transition: all 0.2s; }
  .tab.active { color: #7c83fd; border-bottom-color: #7c83fd; }

  .chat-area { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 72%; padding: 10px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { background: #7c83fd; color: white; align-self: flex-end; border-radius: 12px 12px 2px 12px; }
  .msg.bot  { background: #1e1e32; color: #ddd; align-self: flex-start; border-radius: 12px 12px 12px 2px; }
  .msg.system { background: #1a2a1a; color: #7aff7a; align-self: center; font-size: 12px; padding: 6px 14px; }

  .input-row { display: flex; gap: 10px; padding: 16px 24px; background: #1a1a2e; border-top: 1px solid #2a2a4a; }
  input[type=text] { flex: 1; padding: 10px 16px; border-radius: 8px; border: 1px solid #333; background: #0f0f1a; color: #eee; font-size: 14px; outline: none; }
  input[type=text]:focus { border-color: #7c83fd; }
  button { padding: 10px 22px; background: #7c83fd; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  button:hover { background: #5c63dd; }
  .reload-btn { background: #2a5a2a; }
  .reload-btn:hover { background: #1a4a1a; }
</style>
</head>
<body>

<header>
  <h1>🧠 Family Knowledge Base</h1>
  <span>KRR project 2 — Muhammad Imad</span>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('input')">📥 Add Facts</div>
  <div class="tab" onclick="switchTab('query')">🔍 Query KB</div>
</div>

<div class="chat-area" id="chat"></div>

<div class="input-row">
  <input type="text" id="userInput" placeholder="Type here..." onkeydown="if(event.key==='Enter') sendMsg()">
  <button onclick="sendMsg()">Send</button>
  <button class="reload-btn" onclick="reloadKB()">🔄 Reload KB</button>
</div>

<script>
  let currentMode = 'input';

  function switchTab(mode) {
    currentMode = mode;
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (i===0 && mode==='input') || (i===1 && mode==='query'));
    });
    addMsg('system', mode === 'input'
      ? '📥 Switched to ADD FACTS mode. Try: "Add male Ali" or "Ali was born in 1990"'
      : '🔍 Switched to QUERY mode. Try: "Who is father of Omar?" or "List all males"');
  }

  function addMsg(who, text) {
    const chat = document.getElementById('chat');
    const div  = document.createElement('div');
    div.className = `msg ${who}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMsg() {
    const input = document.getElementById('userInput');
    const msg   = input.value.trim();
    if (!msg) return;
    input.value = '';
    addMsg('user', msg);

    const endpoint = currentMode === 'input' ? '/add' : '/ask';
    const res  = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg })
    });
    const data = await res.json();
    addMsg('bot', data.response);
  }

  async function reloadKB() {
    const res  = await fetch('/reload', { method: 'POST' });
    const data = await res.json();
    addMsg('system', '🔄 ' + data.response);
  }

  // Welcome message
  addMsg('system', '📥 ADD FACTS mode active. Type HELP for commands.');
</script>

</body>
</html>
