<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family KB Chatbot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 400px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; }
        #header { background: #2c3e50; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat-box { height: 400px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 15px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background: #3498db; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-msg { background: #ecf0f1; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-area { display: flex; padding: 10px; background: #ecf0f1; border-top: 1px solid #bdc3c7; }
        #user-input { flex: 1; padding: 10px; border: 1px solid #bdc3c7; border-radius: 5px; outline: none; }
        #send-btn { background: #2c3e50; color: white; border: none; padding: 10px 15px; margin-left: 10px; border-radius: 5px; cursor: pointer; }
        #send-btn:hover { background: #1a252f; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">Family Knowledge Base</div>
    <div id="chat-box">
        <div class="message bot-msg">Hello! I am the Family Knowledge Base assistant. Ask me about any family member!</div>
    </div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Ask a question..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");

    function appendMessage(sender, text, className) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") sendMessage();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage("You", text, "user-msg");
        userInput.value = "";

        try {
            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });
            const data = await response.json();
            appendMessage("Bot", data.response, "bot-msg");
        } catch (error) {
            appendMessage("Bot", "Error connecting to the server.", "bot-msg");
        }
    }
</script>

</body>
</html>
